[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biology-mm"
version = "2.6.0"
description = "Python SDK for Biology MM and Trium-XBT molecular mechanics with Apple Metal and ARM64 NEON acceleration"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[tool.setuptools]
packages = ["biology_mm"]
